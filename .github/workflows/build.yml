name: macOS build

# Manual only — no push/PR/schedule trigger. Nothing here ever builds unless
# someone (or our own tooling, via the same workflow_dispatch API) explicitly
# asks for this exact repo/ref. Codeberg stays the source of truth; this repo
# exists purely to reach a macOS compiler, nothing is authoritative here.
#
# Ninja + a Debug/Release matrix ported from the old GitHub-era
# Godot-Foundation-for-Steamworks build.yml (the last known-working macOS
# build for this product family) — that workflow used Ninja as the CMake
# generator, which is what actually made its builds fast; the previous
# version of this workflow used no generator override at all and took
# 13+ minutes for something as small as xxHash on a cold, effectively
# single-threaded default-Makefile build.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Codeberg repo path, e.g. Heathen-Engineering/Godot-GameplayTags-Foundation"
        required: true
      ref:
        description: "Git tag or branch to build"
        required: true
      addon_dir:
        description: "Path to the CMakeLists.txt directory, relative to repo root (e.g. addons/GameplayTagsFoundation, or . for a flat-layout repo like Game-Framework)"
        required: true
        default: "."
      addon_name:
        description: "Real addon folder name once installed (e.g. GameFrameworkFoundation) — NOT derived from addon_dir, since a flat-layout repo's addon_dir is just \".\""
        required: true
      fetch_steam_sdk:
        description: "Fetch the Steamworks SDK before configuring (only Foundation for Steamworks needs this — the SDK is Valve-licensed, never committed, fetched from the private steamworks-sdk-vendor repo)"
        required: false
        default: "false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    name: Build (${{ matrix.build_type }})
    runs-on: macos-14

    steps:
      - name: Clone source from Codeberg
        run: |
          git clone --branch "${{ inputs.ref }}" --depth 1 --recurse-submodules \
            "https://codeberg.org/${{ inputs.repo }}.git" source

      # Ported from the old GitHub-era Godot-Foundation-for-Steamworks
      # build.yml — the Steamworks SDK is never committed anywhere (Valve's
      # SDK license prohibits redistributing the SDK source/headers/import
      # libs), fetched privately from a dedicated, access-locked repo via a
      # fine-scoped PAT (Contents: read, scoped to that repo only).
      - name: Fetch Steamworks SDK
        if: inputs.fetch_steam_sdk == 'true'
        env:
          GH_TOKEN: ${{ secrets.STEAM_SDK_FETCH_TOKEN }}
        run: |
          gh release download v1.63.0 \
            --repo heathen-engineering/steamworks-sdk-vendor \
            --pattern "steamworks-sdk.zip" \
            --output steamworks-sdk.zip
          mkdir -p "source/${{ inputs.addon_dir }}/include"
          unzip -q steamworks-sdk.zip -d "source/${{ inputs.addon_dir }}/include"
          rm steamworks-sdk.zip

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        working-directory: source/${{ inputs.addon_dir }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        working-directory: source/${{ inputs.addon_dir }}
        run: cmake --build build

      # actions/upload-artifact rejects any path containing a literal "."
      # or ".." path segment ("Invalid pattern ... Relative pathing '.' and
      # '..' is not allowed") — confirmed the hard way: addon_dir="." (the
      # flat-layout case) makes the naive `source/${{ inputs.addon_dir }}`
      # interpolate to "source/.", which upload-artifact's glob validator
      # then rejects outright, failing the whole job even though the build
      # itself succeeded. Resolve to a real absolute path first so "." never
      # appears literally in the glob passed to upload-artifact.
      - name: Resolve bin directory
        id: resolve
        run: echo "bin_dir=$(cd "source/${{ inputs.addon_dir }}/bin" && pwd)" >> "$GITHUB_OUTPUT"

      - name: Upload build type artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.build_type }}
          # CMake links the real product output into bin/ at the addon
          # root (LIBRARY_OUTPUT_DIRECTORY), a sibling of build/ — not
          # inside it. Confirmed the hard way against a real run: searching
          # only build/ silently collects godot-cpp's own intermediate
          # static lib instead of the actual product.
          path: ${{ steps.resolve.outputs.bin_dir }}/*
          if-no-files-found: error

  package:
    name: Package (macOS slice)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both build types
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts
          merge-multiple: true

      # Only the macOS binaries — this repo has no Linux/Windows build of
      # its own (those run on Codeberg's own Forgejo Actions, or locally).
      # This zip is a fragment meant to be merged with those into a real
      # Asset Store package, not a standalone release artifact by itself.
      - name: Assemble macOS binary fragment
        run: |
          mkdir -p "package/addons/${{ inputs.addon_name }}/bin"
          cp artifacts/* "package/addons/${{ inputs.addon_name }}/bin/"
          cd package && zip -r "../${{ inputs.addon_name }}-macos.zip" addons

      - name: Upload packaged fragment
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: "*-macos.zip"
